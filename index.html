<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YORI JOMO - Handmade Leather Goods</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" />
    <link rel="stylesheet" href="figma-tokens.css" />
    <link rel="stylesheet" href="general.css" />
    <link rel="stylesheet" href="styling.css" />
  </head>
  <body>
    <div class="page">
      <!-- Header: menu, centred logo, and shopping bag. -->
      <header class="header">
        <button class="menu" type="button" aria-label="Menu" disabled>
          <img class="header-icon" src="images/menu.svg" alt="" />
        </button>
        <a class="logo" href="index.html" aria-label="Yori Jomo home">
          <picture>
            <source media="(max-width: 700px)" srcset="images/logo-mobile.svg" />
            <img src="images/logo.svg" alt="YORI JOMO" />
          </picture>
        </a>
        <button class="bag" type="button" aria-label="Shopping bag" disabled>
          <img class="header-icon" src="images/shopping-bag.svg" alt="" />
        </button>
      </header>

      <main>
        <!-- Cropped photographs exported from Figma and converted to WebP. -->
        <section class="hero" aria-label="Explore Yori Jomo">
          <div class="hero-grid">
            <div class="hero-main hero-card image-frame image-frame--right">
              <picture>
                <source media="(max-width: 700px)" srcset="images/hero-main-mobile.webp" />
                <img src="images/hero-main.webp" alt="Brown leather shoes worn with black trousers" />
              </picture>
              <span class="hero-label">something new</span>
            </div>
            <div class="hero-shop hero-card image-frame image-frame--diagonal">
              <picture>
                <source media="(max-width: 700px)" srcset="images/hero-shop-mobile.webp" />
                <img src="images/hero-shop.webp" alt="Black Mary Jane shoes with socks and striped trousers" />
              </picture>
              <span class="hero-label">shop</span>
            </div>
            <div class="hero-leather hero-card image-frame image-frame--left">
              <picture>
                <source media="(max-width: 700px)" srcset="images/hero-leather-mobile.webp" />
                <img src="images/hero-leather.webp" alt="Close-up of olive leather and woven detailing" />
              </picture>
              <span class="hero-label">about us</span>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
